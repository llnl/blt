####
# This is the shared configuration of jobs for matrix
.on_matrix:
  variables:
    SCHEDULER_PARAMETERS: "--partition=pci --deadline=now+3hour --gpus=1 -N1 -t 15"
  tags:
    - batch
    - matrix
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /_lnone/ || $ON_MATRIX == "OFF"' #run except if ...
      when: never
    - when: on_success
  before_script:
    - module load cmake/3.30.5


####
# Build jobs
matrix-clang_19.1.3_nvcc:
  variables:
    HOST_CONFIG: "llvm@19.1.3_nvcc.cmake"
  extends: [.build_script, .on_matrix]

matrix-clang_22.1.5_clang_cuda:
  variables:
    HOST_CONFIG: "llvm@22.1.5_clang_cuda.cmake"
  extends: [.build_script, .on_matrix]

####
# CUDA project tests
matrix-llvm_19.1.3_nvcc_test:
  variables:
    ENABLED_BLT_TESTS: "cuda-arch cuda-mpi-cpp"
    HOST_CONFIG: "llvm@19.1.3_nvcc.cmake"
  extends: [.run_project_integration_tests, .on_matrix]

matrix-llvm_22.1.5_clang_cuda_test:
  variables:
    ENABLED_BLT_TESTS: "cuda-arch cuda-mpi-cpp"
    HOST_CONFIG: "llvm@22.1.5_clang_cuda.cmake"
  extends: [.run_project_integration_tests, .on_matrix]
