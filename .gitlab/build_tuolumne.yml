####
# This is the shared configuration of jobs for tuolumne
.on_tuolumne:
  variables:
    SCHEDULER_PARAMETERS: "--queue pci -n1 -t 20m"
  tags:
    - batch
    - tuolumne
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /_qnone/ || $ON_TUOLUMNE == "OFF"' #run except if ...
      when: never
    - when: on_success


####
# Build jobs
tuolumne-clang_18_0_0_hip:
  variables:
    HOST_CONFIG: "clang@18.0.0_hip.cmake"
  extends: [.build_script, .on_tuolumne]

####
# HIP project tests
tuolumne-clang_18.0.0_hip_config_test:
  variables:
    ENABLED_BLT_TESTS: "hip-config-test"
    HOST_CONFIG: "clang@18.0.0_hip.cmake"
  extends: [.run_project_integration_tests, .on_tuolumne]

tuolumne-gcc_10.3.1_clang_17.0.0_hip_config_test:
  variables:
    ENABLED_BLT_TESTS: "hip-config-test"
    HOST_CONFIG: "gcc@10.3.1_clang@17.0.0_hip.cmake"
  extends: [.run_project_integration_tests, .on_tuolumne]
